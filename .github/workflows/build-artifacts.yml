name: Build & Package Deployment Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Client & Server Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Server
        run: pnpm --filter server build

      - name: Build Client SPA PWA
        run: pnpm --filter client build

      - name: Package Server Production Artifact
        run: |
          mkdir -p dist-server
          cp -r server/dist dist-server/
          cp -r server/migrations dist-server/
          cp server/package.json dist-server/
          cp server/server.js dist-server/
          
          # Install production dependencies inside server package
          cd dist-server
          npm install --omit=dev
          cd ..
          
          # Archive server artifact
          zip -qr server-artifact.zip dist-server

      - name: Package Client Static Artifact
        run: |
          mkdir -p dist-client
          cp -r client/dist/* dist-client/
          zip -qr client-artifact.zip dist-client

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-artifact
          path: server-artifact.zip
          retention-days: 7

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-artifact
          path: client-artifact.zip
          retention-days: 7
