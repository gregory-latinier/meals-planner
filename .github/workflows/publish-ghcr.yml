name: Publish Docker images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Web image ────────────────────────────────────────────────────────────

      - name: Extract metadata for web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gregory-latinier/meals-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: web/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Realtime image ───────────────────────────────────────────────────────

      - name: Extract metadata for realtime image
        id: meta-realtime
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gregory-latinier/meals-realtime
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push realtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: realtime/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-realtime.outputs.tags }}
          labels: ${{ steps.meta-realtime.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
