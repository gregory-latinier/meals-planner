services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mpuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mealsplanner}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpuser} -d ${POSTGRES_DB:-mealsplanner}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  init:
    image: ${WEB_IMAGE:-gregorylatinier/meals-web:latest}
    restart: no
    env_file: .env.prod
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma migrate deploy &&
        node -e \"
          const { PrismaClient } = require('@prisma/client');
          const bcrypt = require('bcryptjs');
          const prisma = new PrismaClient();
          async function seed() {
            const existing = await prisma.household.findFirst();
            if (existing) { console.log('Household already exists — skipping seed.'); return; }
            const pw = process.env.HOUSEHOLD_PASSWORD;
            if (!pw) throw new Error('HOUSEHOLD_PASSWORD is required');
            const hash = await bcrypt.hash(pw, 12);
            const h = await prisma.household.create({ data: { passwordHash: hash } });
            console.log('Household created: ' + h.id);
          }
          seed().catch(e => { console.error(e); process.exit(1); }).finally(() => prisma.\$disconnect());
        \"
      "

  web:
    image: ${WEB_IMAGE:-gregorylatinier/meals-web:latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  realtime:
    image: ${REALTIME_IMAGE:-gregorylatinier/meals-realtime:latest}
    restart: unless-stopped
    environment:
      PORT: "3001"
      CLIENT_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NODE_ENV: production
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db_data:
