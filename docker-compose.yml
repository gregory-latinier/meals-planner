services:
  postgres:
    image: postgres:16-alpine
    container_name: meals-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meals
      POSTGRES_PASSWORD: meals
      POSTGRES_DB: meals_planner
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
